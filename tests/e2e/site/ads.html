<!doctype html><title>Ads site</title>
<p>A page with an ad (adserver/banner.js) and a normal script (plain.js).</p>
<script>
  window.loaded = {};
  const load = (name, src) => {
    const s = document.createElement('script');
    s.src = src + '?' + Date.now();
    s.onload = () => (window.loaded[name] = 'loaded');
    s.onerror = () => (window.loaded[name] = 'blocked');
    document.head.append(s);
  };
  load('ad', 'adserver/banner.js');
  load('plain', 'plain.js');
</script>
