<!doctype html>
<title>Music</title>
<p>A soft tone in an audio element, for the mini player.</p>
<audio loop></audio>
<script>
  // One second of a quiet tone as a WAV file, looped (Firn lets pages play
  // without a click first).
  const rate = 8000;
  const samples = rate;
  const bytes = new DataView(new ArrayBuffer(44 + samples * 2));
  const text = (at, s) =>
    [...s].forEach((c, i) => bytes.setUint8(at + i, c.charCodeAt(0)));
  text(0, 'RIFF');
  bytes.setUint32(4, 36 + samples * 2, true);
  text(8, 'WAVEfmt ');
  bytes.setUint32(16, 16, true);
  bytes.setUint16(20, 1, true);
  bytes.setUint16(22, 1, true);
  bytes.setUint32(24, rate, true);
  bytes.setUint32(28, rate * 2, true);
  bytes.setUint16(32, 2, true);
  bytes.setUint16(34, 16, true);
  text(36, 'data');
  bytes.setUint32(40, samples * 2, true);
  for (let i = 0; i < samples; i++)
    bytes.setInt16(
      44 + i * 2,
      Math.sin((i / rate) * 2 * Math.PI * 440) * 2000,
      true,
    );
  const audio = document.querySelector('audio');
  audio.src = URL.createObjectURL(new Blob([bytes], { type: 'audio/wav' }));
  audio.play();
</script>
