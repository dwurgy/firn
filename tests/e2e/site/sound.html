<!doctype html>
<title>Sound</title>
<p>A soft tone, for the speaker on tabs playing sound.</p>
<script>
  // A quiet tone that starts by itself (Firn lets pages play without a
  // click first); stop() and play() are called by the check.
  let ctx, osc;
  function play() {
    ctx = new AudioContext();
    osc = ctx.createOscillator();
    const gain = ctx.createGain();
    gain.gain.value = 0.05;
    osc.connect(gain).connect(ctx.destination);
    osc.start();
  }
  function stop() {
    osc.stop();
    ctx.close();
  }
  play();
</script>
